[package]
name = "unbolt"
version = "0.1.1"
edition = "2024"
default-run = "unbolt"
rust-version = "1.98"
description = "A native Windows application manager and uninstaller written in Rust"
license = "MIT"
repository = "https://github.com/Develifture/Unbolt"
homepage = "https://github.com/Develifture/Unbolt"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = { version = "0.56", features = ["transactions"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_RestartManager", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Com", "Win32_System_SystemServices"] }
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_Storage_EnhancedStorage"] }

[features]
test-fixtures = []

[[bin]]
name = "unbolt"
path = "src/main.rs"

[[bin]]
name = "unbolt-cli"
path = "src/bin/unbolt-cli.rs"

[[bin]]
name = "unbolt-test-fixture"
path = "tests/fixtures/process.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "unbolt-helper"
path = "src/bin/unbolt-helper.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[build-dependencies]
winresource = "0.1.34"
