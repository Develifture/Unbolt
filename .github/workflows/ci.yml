name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust tooling
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Production lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Fixture lint
        run: cargo +stable clippy --locked --all-targets --features test-fixtures -- -D warnings
      - name: Owned fixture checks
        run: cargo +stable test --locked --features test-fixtures
      - name: Portable package
        shell: pwsh
        run: ./scripts/package.ps1